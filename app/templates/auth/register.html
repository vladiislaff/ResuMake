{% extends "base.html" %}
{% block title %}Регистрация — ResuMake{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <h1 class="h2 mb-4">Создать аккаунт</h1>
    <form method="post" novalidate>
      <div class="mb-3">
        <label for="full_name" class="form-label">Имя</label>
        <input class="form-control" id="full_name" name="full_name" maxlength="160"
               value="{{ full_name|default('', true) }}" autocomplete="name">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input class="form-control" type="email" id="email" name="email" required
               maxlength="254" value="{{ email|default('', true) }}" autocomplete="email">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input class="form-control" type="password" id="password" name="password"
               minlength="8" required autocomplete="new-password">
        <div class="form-text">Не менее 8 символов.</div>
      </div>
      <div class="mb-3">
        <label for="password_confirm" class="form-label">Повтори пароль</label>
        <input class="form-control" type="password" id="password_confirm"
               name="password_confirm" minlength="8" required autocomplete="new-password">
      </div>
      <button class="btn btn-primary w-100" type="submit">Зарегистрироваться</button>
    </form>
    <p class="mt-3 text-secondary">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
  </div>
</div>
{% endblock %}
