{% extends "base.html" %}
{% block title %}Вход — ResuMake{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <h1 class="h2 mb-4">Войти в ResuMake</h1>
    <form method="post" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input class="form-control" type="email" id="email" name="email" required
               maxlength="254" value="{{ email|default('', true) }}" autocomplete="email">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input class="form-control" type="password" id="password" name="password"
               required autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100" type="submit">Войти</button>
    </form>
    <p class="mt-3 text-secondary">Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрироваться</a></p>
  </div>
</div>
{% endblock %}
